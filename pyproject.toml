[project]
name = "iqr"
version = "0.1.0"
description = "IQR - agentic AI validation of SOX 404 controls with a citation for every claim"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2",
  "openpyxl",
  "pandas",
  "pillow",
  "pytesseract",
  "langgraph",
  "fastapi",
  "uvicorn",
  "python-docx",
  "python-dateutil",
  "httpx",
  "httpx2",
  "extract-msg",
  "python-multipart",
  "pyxlsb",
  "mcp>=2",
  "pytest",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["iqr*"]
